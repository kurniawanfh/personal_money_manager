name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - 'mobile/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Prepare Android Platform Files
        working-directory: mobile
        run: |
          if [ ! -d "android" ]; then
            flutter create --platforms=android --org com.kurniawanfh .
          fi

      # Decode release keystore when the secrets are configured.
      # Repo secrets needed: KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_PASSWORD, KEY_ALIAS
      # Create KEYSTORE_BASE64 with: base64 -w0 release.jks
      - name: Configure Release Signing
        if: env.KEYSTORE_BASE64 != ''
        working-directory: mobile/android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          cat > key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=release.jks
          EOF
          chmod 600 key.properties release.jks

      - name: Install Flutter Dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Run Build Runner (Code Generation)
        working-directory: mobile
        run: |
          dart run build_runner build --delete-conflicting-outputs || true

      - name: Build Release APK
        working-directory: mobile
        run: flutter build apk --release --split-per-abi

      - name: Verify APK Signature
        working-directory: mobile
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          for apk in build/app/outputs/flutter-apk/*.apk; do
            echo "--- $apk"
            "$APKSIGNER" verify --print-certs "$apk" | grep 'certificate DN' || true
          done

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: mobile/build/app/outputs/flutter-apk/*.apk
          retention-days: 14

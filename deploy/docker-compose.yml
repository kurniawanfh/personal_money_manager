version: '3.8'

services:
  app:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    working_dir: /var/www/html
    environment:
      APP_ENV: production
      APP_DEBUG: 'false'
      APP_URL: http://localhost:8000
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: money_manager_prod
      DB_USERNAME: money_user
      DB_PASSWORD: ${DB_PASSWORD:-SecretSecurePass2026!}
    volumes:
      - ../backend:/var/www/html
      - storage_data:/var/www/html/storage
    depends_on:
      - postgres
      - redis
    networks:
      - app_network

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: money_manager_prod
      POSTGRES_USER: money_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-SecretSecurePass2026!}
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - app_network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - app_network

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8000:80" # Binds to 8000 strictly preserving ports 3000 (sablonku) and 3001 (absenku)
    volumes:
      - ../backend:/var/www/html
      - ./nginx/app.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  pg_data:
  redis_data:
  storage_data:

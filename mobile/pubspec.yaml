name: personal_money_manager
description: "A production-ready multi-user Personal Money Manager & Subscription Tracker Flutter App."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.4.3+1
  drift: ^2.16.0
  sqlite3_flutter_libs: ^0.5.20
  path_provider: ^2.1.2
  path: ^1.9.0
  flutter_local_notifications: ^17.1.0
  timezone: ^0.9.2
  intl: ^0.19.0
  uuid: ^4.3.3
  shared_preferences: ^2.2.2
  provider: ^6.1.2
  flutter_secure_storage: ^9.2.2
  speech_to_text: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  drift_dev: ^2.16.0
  build_runner: ^2.4.8
  mockito: ^5.4.4

flutter:
  uses-material-design: true
